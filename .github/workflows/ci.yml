name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: |
          uv export --format requirements-txt --no-hashes -o /tmp/req.txt
          # The export is the resolved lock: pip must not resolve it again, or an override
          # in pyproject.toml reads as a conflict
          uvx pip-audit -r /tmp/req.txt --no-deps --disable-pip
